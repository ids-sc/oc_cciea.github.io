name: Code1 NPH, pmsl update

env:
  PYTHON_VERSION: "3.12"


on:
  workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: true
          channels: conda-forge,defaults
          python-version: 3.12
          # These properties enable the use of mamba, which is much faster and far less error
          # prone than conda while being completely compatible with the conda CLI
          use-mamba: true
          mamba-version: "*"	  

      - name: Install some packages
        # The `-l` is needed so conda environment activation works correctly
        shell: bash -l {0}
        run: |
          mamba install -c conda-forge numpy pandas scipy matplotlib xarray dask netCDF4 bottleneck requests cartopy seawater pydap

      - name: set pythonpath
        run: |
            echo "PYTHONPATH=code_gha/fun_gha/" >> $GITHUB_ENV

      - name: install Octave
        run: |
          sudo apt-get -y install octave octave-netcdf octave-image
      - name: Run Python download data from Erddap
        shell: bash -l {0}      
        run: python code_gha/NPH/pmsl_monthly_update.py
      - name: Run Octave calc NPH and save to CSV
        run: octave code_gha/NPH/calc_nph.m

      - name: Remove download diretory an list 
        shell: bash {0}
        run: |
          tree
          df -h

      - name: git auto commit
        uses: stefanzweifel/git-auto-commit-action@v7
